<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B4A57">
<title>Espace Formation</title>
<script>
  (function () {
    var pref = "auto";
    try { pref = localStorage.getItem("mode") || "auto"; } catch (e) {}
    var dark = pref === "dark" || (pref === "auto" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-mode", dark ? "dark" : "light");
  })();
</script>
<style>
  :root { --bg:#fff; --surface:#fff; --band:#FDF0F4; --ink:#1B1A22; --muted:#5A5560; --line:#EBD3DB; --accent:#E0307F; --accent-ink:#fff; --head:#0B4A57; --radius:12px;
    --font: "Avenir Next","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; }
  :root[data-mode="dark"] { color-scheme: dark; --bg:#121316; --surface:#1F2026; --band:#1A1B20; --ink:#EDEBEF; --muted:#A9A5B0; --line:#34353E; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:var(--font); background:var(--bg); color:var(--ink); line-height:1.55; font-size:17px; }
  .wrap { max-width:1040px; margin:0 auto; padding:0 20px; }
  header { background:var(--head); color:#fff; padding:18px 0; }
  header .header-flex { display:flex; justify-content:space-between; align-items:center; }
  header h1 { margin:0; font-size:1.25rem; }
  .logout-btn { background:transparent; border:1px solid #fff; color:#fff; padding:6px 14px; border-radius:8px; cursor:pointer; font-weight:700; font-size:.85rem; }
  main { padding:24px 0 48px; }
  .btn { display:inline-flex; align-items:center; justify-content:center; background:var(--accent); color:var(--accent-ink); font:inherit; font-weight:800; padding:13px 20px; border-radius:var(--radius); border:0; text-decoration:none; cursor:pointer; }
  .btn.wa { background:#25D366; color:#06240F; }
  .box { background:var(--surface); border:1.5px solid var(--line); border-radius:var(--radius); padding:20px; text-align:center; margin-top:20px; }
  .msg { margin:0 0 14px; font-weight:600; }
  .actions { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:14px; }
  .layout { display:grid; gap:20px; }
  .player { aspect-ratio:16/9; width:100%; background:#000; border-radius:var(--radius); overflow:hidden; }
  .player iframe { width:100%; height:100%; border:0; display:block; }
  .now { margin:10px 0 0; font-weight:700; }
  .list h2 { font-size:.8rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:18px 0 6px; }
  .list h2:first-child { margin-top:0; }
  .lesson { display:flex; gap:12px; width:100%; text-align:left; font:inherit; color:var(--ink); background:var(--surface); border:1.5px solid var(--line); border-radius:10px; padding:11px 14px; margin:6px 0; cursor:pointer; }
  .lesson b { flex:0 0 2em; color:var(--accent); }
  .lesson[aria-current="true"] { border-color:var(--accent); }
  .lesson:disabled { opacity:.55; cursor:not-allowed; }
  .keep { margin-top:24px; background:var(--band); text-align:left; }
  .keep p { margin:0 0 6px; color:var(--muted); font-size:.92rem; }
  [hidden] { display:none !important; }
  @media (min-width: 860px) { .layout { grid-template-columns: 1.6fr 1fr; align-items:start; } }

  .cloth{height:18px;background-color:#062F39;background-image:linear-gradient(135deg,#E0307F 25%,transparent 25%),linear-gradient(225deg,#E0307F 25%,transparent 25%),linear-gradient(315deg,#E0307F 25%,transparent 25%),linear-gradient(45deg,#E0307F 25%,transparent 25%);background-size:18px 18px;background-position:-9px 0,-9px 0,0 0,0 0;}
  header{position:relative;overflow:hidden;}
  header::before{content:"";position:absolute;right:-120px;top:-140px;width:360px;height:360px;border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 16px,rgba(255,255,255,.07) 16px 21px);pointer-events:none;}
  header .header-flex{position:relative;}
  .btn{border-radius:var(--radius);box-shadow:0 2px 0 rgba(0,0,0,.25);}
  .now-row { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:14px; }
  .now-row .now { margin:0; min-width:0; }
  .fs-btn { flex:none; display:inline-flex; align-items:center; gap:8px; font:inherit; font-weight:700; font-size:.88rem; padding:9px 14px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer; transition:border-color .2s,transform .15s; }
  .fs-btn:hover { border-color:var(--accent); } .fs-btn:active { transform:scale(.96); }
  .fs-btn:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  .player:fullscreen { border-radius:0; border:0; background:#000; }
  .player.pfs { position:fixed; inset:0; z-index:1000; width:100%; height:100dvh; aspect-ratio:auto; border-radius:0; border:0; }
  body.pfs-on { overflow:hidden; }
  .pfs-close { position:absolute; top:calc(10px + env(safe-area-inset-top,0px)); right:10px; z-index:2; display:flex; align-items:center; gap:6px; font:inherit; font-weight:700; font-size:.85rem; padding:8px 14px; border:0; border-radius:999px; background:rgba(0,0,0,.65); color:#fff; cursor:pointer; backdrop-filter:blur(6px); }
  /* Mise en page fixe : en-tête et vidéo ne bougent pas, seule la liste des leçons défile */
  html, body { height:100%; }
  body { height:100vh; height:100dvh; display:flex; flex-direction:column; overflow:hidden; }
  header { flex:none; }
  .cloth { flex:none; }
  main { flex:1; min-height:0; width:100%; display:flex; flex-direction:column; padding:14px 20px 0; }
  #course { flex:1; min-height:0; display:flex; flex-direction:column; }
  .layout { flex:1; min-height:0; display:flex; flex-direction:column; gap:10px; }
  .layout > div:first-child { flex:none; }
  .list { flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; scrollbar-width:thin; padding:0 2px calc(16px + env(safe-area-inset-bottom,0px)) 0; }
  .list h2 { position:sticky; top:0; z-index:1; background:var(--bg); margin:0; padding:12px 0 6px; }
  .list .keep { margin-top:18px; }
  /* Mobile : zone vidéo pleine largeur, sans carte flottante, fondue dans un bandeau sombre sous l'en-tête */
  main { padding:0; }
  #state { margin:20px; }
  .layout { gap:0; }
  .layout > div:first-child { background:#0B0D12; }
  .player { border-radius:0; border:0; box-shadow:none; }
  .now-row { margin:0; padding:10px 16px 12px; background:#0B0D12; }
  .now-row .now { color:#fff; font-size:1.02rem; }
  .fs-btn { background:rgba(255,255,255,.1); border-color:rgba(255,255,255,.25); color:#fff; }
  .list { padding:0 20px calc(16px + env(safe-area-inset-bottom,0px)) 20px; }
  @media (min-width:560px) and (orientation:landscape), (min-width:860px) {
    .layout { display:grid; grid-template-columns:1.6fr 1fr; grid-template-rows:minmax(0,1fr); gap:20px; }
    .layout > div:first-child { min-height:0; overflow-y:auto; }
    .player { max-height:calc(100dvh - 190px); border-radius:var(--radius); }
    main { padding:14px 20px 0; }
    #state { margin:20px 0 0; }
    .layout > div:first-child { background:none; }
    .now-row { margin-top:14px; padding:0; background:none; }
    .now-row .now { color:inherit; font-size:1.3rem; }
    .fs-btn { background:var(--surface); border-color:var(--line); color:var(--ink); }
    .list { padding:0 2px calc(16px + env(safe-area-inset-bottom,0px)) 0; }
  }
  .player.pfs { max-height:none; }
  /* ---- Chargement : même style que la page d'accueil ---- */
  .spin { display:inline-block; width:22px; height:22px; border-radius:50%; border:3px solid color-mix(in srgb,var(--accent) 22%,transparent); border-top-color:var(--accent); animation:spin .8s linear infinite; }
  .spin.big { width:46px; height:46px; border-width:4px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #state-text::before { content:""; display:block; width:34px; height:34px; margin:0 auto 14px; border-radius:50%; border:4px solid color-mix(in srgb,var(--accent) 22%,transparent); border-top-color:var(--accent); animation:spin .8s linear infinite; }
  #state.err #state-text::before { display:none; }
  .player { position:relative; }
  .pload { position:absolute; inset:0; display:grid; place-items:center; background:#0B0D12; }
  .btn.loading { pointer-events:none; }
  .btn.loading::before { content:""; width:16px; height:16px; flex:none; border-radius:50%; border:2.5px solid rgba(255,255,255,.4); border-top-color:#fff; animation:spin .7s linear infinite; }
  @media (prefers-reduced-motion:reduce) { .spin, #state-text::before, .btn.loading::before { animation-duration:2.4s; } }
</style>
</head>
<body>
<header>
  <div class="wrap header-flex">
    <h1>Formation TikTok et Facebook</h1>
    <button class="logout-btn" id="logout" type="button" hidden>Déconnexion</button>
  </div>
</header>
<div class="cloth" aria-hidden="true"></div>

<main class="wrap">
  <div class="box" id="state" role="status">
    <p class="msg" id="state-text">Vérification de l'accès en cours…</p>
    <button type="button" class="btn" id="retry" hidden>Réessayer</button>
  </div>

  <div id="course" hidden>
    <div class="layout">
      <div>
        <div class="player" id="player">
          <div style="display:grid;place-items:center;height:100%;color:#bbb;padding:20px;text-align:center">
            Choisis une vidéo dans la liste pour démarrer
          </div>
        </div>
        <div class="now-row">
          <p class="now" id="now"></p>
          <button type="button" class="fs-btn" id="fs" hidden aria-label="Mettre la vidéo en plein écran">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Plein écran
          </button>
        </div>
      </div>
      <div class="list" id="list"></div>
    </div>

    <div class="box keep" id="keep">
      <strong>Garde ton accès sécurisé</strong>
      <p>Ton compte est personnel et limité à 3 appareils.</p>
    </div>
  </div>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { initializeAuth, indexedDBLocalPersistence, browserLocalPersistence, browserSessionPersistence, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDOiSztn34AVyFqF_ditRpZiHmeTCIwu80",
    authDomain: "formation-lerbrb.firebaseapp.com",
    projectId: "formation-lerbrb",
    storageBucket: "formation-lerbrb.firebasestorage.app",
    messagingSenderId: "623961164775",
    appId: "1:623961164775:web:7ce4ec4762b78943b98b42"
  };

  var CONFIG = {
    api: "https://acces-formation.privatslabs.workers.dev"
  };

  const app = initializeApp(firebaseConfig);
  // Connexion conservée après fermeture de l'onglet, jusqu'à la déconnexion volontaire du client
  const auth = initializeAuth(app, { persistence: [indexedDBLocalPersistence, browserLocalPersistence, browserSessionPersistence] });

  var DEV = "device_id";
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  function deviceId() {
    var d = lsGet(DEV);
    if (!d || !/^[A-Za-z0-9_-]{16,64}$/.test(d)) {
      d = Array.from(crypto.getRandomValues(new Uint8Array(16)), b => ("0" + b.toString(16)).slice(-2)).join("");
      lsSet(DEV, d);
    }
    return d;
  }

  var $ = function (id) { return document.getElementById(id); };

  $("logout").onclick = function () {
    signOut(auth).then(function() { window.location.replace("index.html"); });
  };

  /* On ne déconnecte le client que pour un vrai refus (compte non validé, limite d'appareils, compte supprimé).
     Un problème de réseau ou une erreur temporaire du serveur ne le déconnecte jamais : il peut réessayer. */
  var HARD = /auth\/(user-token-expired|user-disabled|user-not-found|invalid-user-token)/;
  var MSG = {
    "not-paid": "Votre compte n'est pas encore validé par l'administrateur.",
    "devices": "Limite de 3 appareils atteinte pour ce compte. Contactez l'administrateur.",
    "session": "Session expirée. Reconnectez-vous."
  };
  function refuse(text) {
    signOut(auth).then(function () {
      alert("Accès refusé : " + text);
      window.location.replace("index.html");
    });
  }
  function softFail() {
    $("state").hidden = false; $("course").hidden = true;
    $("logout").hidden = false;
    $("state-text").textContent = "Connexion impossible pour le moment. Vérifie ta connexion internet puis réessaie.";
    $("state").classList.add("err");
    $("retry").hidden = false;
  }
  function loadCourse(user, attempt) {
    $("retry").hidden = true;
    $("state").classList.remove("err");
    $("state-text").textContent = "Vérification de l'accès en cours…";
    return user.getIdToken(true)
      .then(function (token) {
        return fetch(CONFIG.api + "/videos", { headers: { "Authorization": "Bearer " + token, "X-Device": deviceId() }, cache: "no-store" });
      })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { status: r.status, body: j }; }); })
      .then(function (res) {
        if (res.status === 200) {
          $("logout").hidden = false;
          LESSONS = res.body.lessons; currentUser = user; loadedAt = Date.now(); render(LESSONS);
          return;
        }
        var code = res.body && res.body.error;
        console.warn("Accès /videos :", res.status, code);
        if (res.status === 403 && (code === "not-paid" || code === "devices")) { refuse(MSG[code]); return; }
        throw new Error("temporaire");
      })
      .catch(function (err) {
        if (err && HARD.test(err.code || "")) { refuse(MSG.session); return; }
        if (attempt < 2) {
          return new Promise(function (r) { setTimeout(r, 2000); }).then(function () { return loadCourse(user, attempt + 1); });
        }
        softFail();
      });
  }
  $("retry").onclick = function () { if (auth.currentUser) loadCourse(auth.currentUser, 0); };

  onAuthStateChanged(auth, function (user) {
    if (!user) { try { localStorage.removeItem("hs"); } catch (e) {} window.location.replace("index.html"); return; }
    try { localStorage.setItem("hs", "1"); } catch (e) {}
    loadCourse(user, 0);
  });

  /* Les liens vidéo expirent après 30 min : on les renouvelle avant (au clic, et toutes les 20 min) */
  var LESSONS = [], loadedAt = 0, currentUser = null, FRESH = 20 * 60 * 1000;
  function refreshLinks() {
    if (!currentUser) return Promise.resolve();
    return currentUser.getIdToken(true)
      .then(function (t) { return fetch(CONFIG.api + "/videos", { headers: { "Authorization": "Bearer " + t, "X-Device": deviceId() }, cache: "no-store" }); })
      .then(function (r) {
        if (r.ok) return r.json();
        // On ne déconnecte que si l'admin a retiré l'accès ou si la limite d'appareils est atteinte
        return r.json().catch(function () { return {}; }).then(function (b) {
          if (r.status === 403 && (b.error === "not-paid" || b.error === "devices")) { signOut(auth).then(function () { window.location.replace("index.html"); }); }
          return null;
        });
      })
      .then(function (j) {
        if (!j || !j.lessons) return;
        j.lessons.forEach(function (n) { var o = LESSONS.find(function (x) { return x.n === n.n; }); if (o) o.url = n.url; });
        loadedAt = Date.now();
      })
      .catch(function () {});
  }
  function fresh() { return Date.now() - loadedAt > FRESH ? refreshLinks() : Promise.resolve(); }
  setInterval(refreshLinks, FRESH);

  function render(lessons) {
    $("state").hidden = true; 
    $("course").hidden = false;
    var list = $("list"); 
    list.innerHTML = "";
    var last = null, buttons = [];

    lessons.forEach(function (l) {
      if (l.module !== last) { 
        var h = document.createElement("h2"); 
        h.textContent = l.module; 
        list.appendChild(h); 
        last = l.module; 
      }
      var b = document.createElement("button");
      b.type = "button"; 
      b.className = "lesson";
      var n = document.createElement("b"); 
      n.textContent = l.n;
      var t = document.createElement("span"); 
      t.textContent = l.title + (l.url ? "" : " (bientôt)");
      b.appendChild(n); 
      b.appendChild(t);
      if (!l.url) { b.disabled = true; }
      b.addEventListener("click", function () { fresh().then(function () { play(l, b, buttons); }); });
      list.appendChild(b); 
      buttons.push(b);
    });

    // Le bloc "accès sécurisé" défile avec la liste
    list.appendChild($("keep"));

    // La première vidéo disponible est déjà placée dans le lecteur, prête à être lancée
    for (var k = 0; k < lessons.length; k++) {
      if (lessons[k].url) { play(lessons[k], buttons[k], buttons, true); break; }
    }
  }

  /* Plein écran : natif si possible, sinon mode plein écran simulé (iPhone et navigateurs mobiles limités) */
  (function () {
    var btn = $("fs"), player = $("player"), close = null;
    function lockLandscape() { try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(function () {}); } catch (e) {} }
    function pseudoOn() {
      player.classList.add("pfs"); document.body.classList.add("pfs-on");
      close = document.createElement("button"); close.type = "button"; close.className = "pfs-close"; close.textContent = "\u2715 Quitter";
      close.onclick = pseudoOff; player.appendChild(close);
    }
    function pseudoOff() {
      player.classList.remove("pfs"); document.body.classList.remove("pfs-on");
      if (close) { close.remove(); close = null; }
    }
    function isNative() { return document.fullscreenElement || document.webkitFullscreenElement; }
    btn.addEventListener("click", function () {
      if (player.classList.contains("pfs")) { pseudoOff(); return; }
      if (isNative()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
      var rq = player.requestFullscreen || player.webkitRequestFullscreen;
      if (rq) {
        try {
          var r = rq.call(player);
          if (r && r.then) { r.then(lockLandscape).catch(pseudoOn); } else { lockLandscape(); }
          return;
        } catch (e) {}
      }
      pseudoOn();
    });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && player.classList.contains("pfs")) pseudoOff(); });
  })();

  function play(l, btn, buttons, silent) {
    if (!l.url) return;
    buttons.forEach(function (b) { b.removeAttribute("aria-current"); });
    btn.setAttribute("aria-current", "true");
    var p = $("player"); 
    p.innerHTML = "";
    var f = document.createElement("iframe");
    f.src = l.url; 
    f.allow = "autoplay; fullscreen; picture-in-picture; encrypted-media"; 
    f.allowFullscreen = true; 
    f.title = l.title;
    p.appendChild(f);
    var ld = document.createElement("div"); ld.className = "pload"; ld.innerHTML = '<span class="spin big"></span>';
    p.appendChild(ld);
    f.addEventListener("load", function () { ld.remove(); });
    setTimeout(function () { if (ld.parentNode) ld.remove(); }, 8000);
    $("now").textContent = l.n + ". " + l.title;
    $("fs").hidden = false;
  }
</script>
</body>
</html>
